name: Update and deploy

on:
  schedule:
    # Minute 17, not :00, because the top of the hour is when GitHub's scheduler is busiest.
    - cron: "17 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["site/**", "pipeline/**", "config/**"]

# Everything is read-only unless a job asks for more below.
permissions:
  contents: read

# One run at a time, and never cancel a run that is half-way through publishing.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # push the data commit
      pages: read # configure-pages reads the Pages settings (it never changes them)
    outputs:
      ok: ${{ steps.pipeline.outputs.ok }} # "true"/"false" from the pipeline; empty when it didn't run
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v7
        with:
          node-version: "26" # current LTS line (v26 "Lithium")

      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Python tests
        run: pytest -q

      - name: JavaScript tests
        run: node --test site/js

      # A push only redeploys the site. The Scout fetch (one request per run) happens on
      # the schedule or a manual run. The User-Agent comes from config/app.json.
      # After the stop_fetching_after date in config/app.json this step does nothing: no request, no file
      # changes, exit 0 with ok=true. The commit step below then finds nothing to commit, and the run stays green.
      - name: Fetch Scout and update data
        id: pipeline
        if: github.event_name != 'push'
        run: python -m pipeline.main

      - name: Commit changed data
        if: github.event_name != 'push'
        run: |
          if [ -n "$(git status --porcelain site/data)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add site/data
            git commit -m "data: Scout snapshot $(date -u '+%Y-%m-%d %H:%M UTC')"
            git pull --rebase
            git push
          else
            echo "No data changes to commit."
          fi

      # Upload from this same job, after the commit, so the deployed files include the
      # new data. A separate job would check out the triggering commit instead.
      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: update
    runs-on: ubuntu-latest
    permissions:
      pages: write # create the Pages deployment
      id-token: write # prove the deployment comes from this workflow (OIDC)
      contents: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  # Runs after the deploy, so a failed Scout update still publishes the page (which then
  # says the last attempt failed) and the run is still marked red.
  report:
    needs: [update, deploy]
    if: needs.update.outputs.ok == 'false'
    runs-on: ubuntu-latest
    steps:
      - name: Fail because the Scout update failed
        run: |
          echo "::error title=Scout update failed::The pipeline recorded ok=false. See site/data/status.json for the reason."
          exit 1
